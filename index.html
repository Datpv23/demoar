<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Diorama (Khóa Căn Phòng)</title>
    <style>
        body { margin: 0; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #status-bar { position: absolute; top: 15px; width: 100%; text-align: center; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 15px; font-weight: bold; pointer-events: none; z-index: 10; padding: 0 10px; box-sizing: border-box;}

        #loading-spinner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid white; border-radius: 50%; animation: spin 1s linear infinite; z-index: 20; }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        #item-menu { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: none; background: rgba(0, 0, 0, 0.6); padding: 12px; border-radius: 20px; z-index: 10; white-space: nowrap; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px); max-width: 90vw; scroll-behavior: smooth;}
        .item-btn { background: #fff; border: 3px solid transparent; padding: 10px 20px; margin: 0 5px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .item-btn:active { transform: scale(0.95); }
        .item-btn.active { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; }

        #edit-menu { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: none; background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 20px; z-index: 20; box-shadow: 0 10px 25px rgba(0,0,0,0.3); backdrop-filter: blur(10px); width: 85vw; max-width: 400px;}
        .edit-title { margin-bottom: 12px; font-size: 14px; font-weight: bold; color: #333; text-align: center;}
        
        .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; font-size: 14px; font-weight: bold;}
        .slider-row input { flex-grow: 1; accent-color: #4caf50; }
        
        .edit-controls { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 15px;}
        .edit-btn { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        #btn-delete { background: #ff4d4d; color: white; }
        #btn-done { background: #4caf50; color: white; }
    </style>
</head>
<body>
    <div id="status-bar">Đang tìm mặt phẳng thật... Hãy quét sàn nhà</div>
    <div id="loading-spinner"></div>

    <div id="item-menu">
        <button class="item-btn" data-model="models/PHONGVE3D.glb">Phòng vẽ 3D</button>
        <button class="item-btn" data-model="models/bang.glb">Bảng</button>
        <button class="item-btn" data-model="models/bangv.glb">Bảng V</button>
        <button class="item-btn" data-model="models/BINHCAFE.glb">Bình Cafe</button>
        <button class="item-btn" data-model="models/gom1.glb">Gốm 1</button>
        <button class="item-btn" data-model="models/gom2.glb">Gốm 2</button>
        <button class="item-btn" data-model="models/khoinon.glb">Khối nón</button>
        <button class="item-btn" data-model="models/khoitru.glb">Khối trụ</button>
        <button class="item-btn" data-model="models/khoivuong.glb">Khối vuông</button>
    </div>

    <div id="edit-menu">
        <div class="edit-title">Chỉnh sửa vật thể</div>
        <div class="slider-row">
            <label>Xoay:</label>
            <input type="range" id="slider-rotate" min="0" max="360" value="0">
        </div>
        <div class="slider-row">
            <label>Cao:</label>
            <input type="range" id="slider-height" min="-0.5" max="2.5" step="0.05" value="0">
        </div>
        <div class="edit-controls">
            <button id="btn-delete" class="edit-btn">Xóa</button>
            <button id="btn-done" class="edit-btn">Xong</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let container, camera, scene, renderer;
        let controller, reticle;
        
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let planeFound = false;
        let currentModelPath = null; 
        const placedObjects = [];    
        let activeObject = null;     

        // BẢN NÂNG CẤP: Biến lưu trữ căn phòng
        let mainRoom = null;

        const gltfLoader = new GLTFLoader();
        const raycaster = new THREE.Raycaster();
        
        let mixers = [];
        const clock = new THREE.Clock();

        let initialPinchDistance = 0;
        let initialScale = 1;

        init();
        animate();

        function init() {
            container = document.createElement( 'div' );
            document.body.appendChild( container );

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 20 );

            const ambientLight = new THREE.AmbientLight( 0xffffff, 1.5 );
            scene.add( ambientLight );

            const dirLight = new THREE.DirectionalLight( 0xffffff, 1.5 );
            dirLight.position.set( 2, 5, 2 );
            scene.add( dirLight );

            renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
            renderer.setPixelRatio( Math.min(window.devicePixelRatio, 2) );
            renderer.setSize( window.innerWidth, window.innerHeight );
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = false; 
            container.appendChild( renderer.domElement );

            document.body.appendChild( ARButton.createButton( renderer, { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            } ) );

            // Vòng ngắm nâng cấp: Hiển thị hướng (để biết đang bám tường hay bám sàn)
            const ringGeo = new THREE.RingGeometry( 0.1, 0.15, 32 );
            ringGeo.rotateX( - Math.PI / 2 );
            reticle = new THREE.Mesh(
                ringGeo,
                new THREE.MeshBasicMaterial( { color: 0x00ff00, side: THREE.DoubleSide } )
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add( reticle );

            controller = renderer.xr.getController( 0 );
            controller.addEventListener( 'select', onSelect );
            scene.add( controller );

            setupUI();
            setupGestures();

            window.addEventListener( 'resize', onWindowResize );
        }

        function onSelect() {
            if (!reticle.visible) return;

            // 1. KIỂM TRA CHẠM VÀO ĐỒ VẬT
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation( controller.matrixWorld );
            raycaster.ray.origin.setFromMatrixPosition( controller.matrixWorld );
            raycaster.ray.direction.set( 0, 0, - 1 ).applyMatrix4( tempMatrix );

            // Chỉ dò chạm vào các đồ vật được đặt (không dò chạm vào khung phòng để tránh lỗi UX)
            const objectsToIntersect = placedObjects.filter(obj => obj !== mainRoom);
            const intersects = raycaster.intersectObjects( objectsToIntersect, true );

            if ( intersects.length > 0 ) {
                let selectedMesh = intersects[0].object;
                while (selectedMesh.parent && !placedObjects.includes(selectedMesh)) {
                    selectedMesh = selectedMesh.parent;
                }
                
                if (placedObjects.includes(selectedMesh)) {
                    if (activeObject === selectedMesh) {
                        closeEditMode();
                    } else {
                        openEditMode(selectedMesh);
                    }
                    return; 
                }
            }

            // 2. DI CHUYỂN VẬT
            if ( activeObject ) {
                // Di chuyển tới vị trí vòng ngắm ảo/thật
                activeObject.position.setFromMatrixPosition( reticle.matrix );
                const currentOffset = activeObject.userData.offsetY || 0;
                activeObject.position.y += currentOffset;
                
                document.getElementById('status-bar').innerText = "Đã dời vật. Bấm Xong để chốt vị trí.";
                return;
            }

            // 3. ĐẶT VẬT / PHÒNG MỚI
            if ( currentModelPath && !activeObject ) {
                document.getElementById('status-bar').innerText = "Đang tạo không gian...";
                document.getElementById('loading-spinner').style.display = "block";
                
                const isPlacingRoom = currentModelPath.includes('PHONGVE3D');

                gltfLoader.load(currentModelPath, function(gltf) {
                    const model = gltf.scene;
                    
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.geometry.computeBoundingBox();
                            child.geometry.computeBoundingSphere();
                            child.castShadow = false; 
                            child.receiveShadow = false;
                        }
                    });

                    // Cân bằng tỷ lệ
                    const initialBox = new THREE.Box3().setFromObject(model);
                    const size = initialBox.getSize(new THREE.Vector3());
                    const maxDimension = Math.max(size.x, size.y, size.z);

                    if (maxDimension > 1.0 && !isPlacingRoom) {
                        const scaleDown = 0.5 / maxDimension;
                        model.scale.set(scaleDown, scaleDown, scaleDown);
                    } else if (maxDimension < 0.05 && !isPlacingRoom) {
                        const scaleUp = 0.2 / maxDimension;
                        model.scale.set(scaleUp, scaleUp, scaleUp);
                    }

                    // Ép đáy
                    const scaledBox = new THREE.Box3().setFromObject(model);
                    const center = scaledBox.getCenter(new THREE.Vector3());

                    model.position.x = -center.x;
                    model.position.y = -scaledBox.min.y; 
                    model.position.z = -center.z;

                    const wrapper = new THREE.Group();
                    wrapper.position.setFromMatrixPosition( reticle.matrix );
                    // Nếu là đặt đồ đạc trong phòng, giữ cho nó đứng thẳng, không bị nghiêng theo mặt tường
                    if (mainRoom && !isPlacingRoom) {
                         const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                         wrapper.position.copy(pos);
                         // Không copy quaternion của tường để đồ vật luôn hướng lên trên
                    } else {
                         wrapper.quaternion.setFromRotationMatrix( reticle.matrix );
                    }
                    
                    wrapper.userData.offsetY = 0;
                    wrapper.add(model);
                    
                    // THUẬT TOÁN LOCAL SPACE: 
                    // Nếu đã có phòng, đồ vật mới sẽ gắn làm "Con" của scene, 
                    // nhưng logic vòng ngắm ảo (bên dưới) sẽ giúp nó nằm gọn trên bề mặt của phòng.
                    scene.add(wrapper);
                    placedObjects.push(wrapper);

                    // Lưu ID phòng để thay đổi vòng ngắm
                    if (isPlacingRoom) {
                        mainRoom = wrapper;
                        document.getElementById('status-bar').innerText = "Đã đặt Phòng! Kể từ giờ đồ vật sẽ chỉ bám vào phòng này.";
                    } else {
                        document.getElementById('status-bar').innerText = "Chạm phòng để đặt thêm, chạm vật để sửa";
                    }

                    if (gltf.animations && gltf.animations.length > 0) {
                        const mixer = new THREE.AnimationMixer(model);
                        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                        mixers.push(mixer);
                    }
                    
                    document.getElementById('loading-spinner').style.display = "none";
                }, undefined, function(error) {
                    document.getElementById('status-bar').innerText = "Lỗi tải model!";
                    document.getElementById('loading-spinner').style.display = "none";
                });
            }
        }

        function setupUI() {
            const itemBtns = document.querySelectorAll('.item-btn');
            itemBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    itemBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentModelPath = e.target.getAttribute('data-model');
                    
                    if(activeObject) closeEditMode();
                    
                    if (currentModelPath.includes('PHONGVE3D')) {
                        document.getElementById('status-bar').innerText = "Vui lòng quét mặt sàn THẬT để đặt phòng.";
                    } else {
                        document.getElementById('status-bar').innerText = mainRoom ? "Hãy trỏ camera vào bên trong Phòng 3D để đặt vật." : "Đã chọn vật phẩm. Chạm vào vòng xanh để đặt.";
                    }
                });
            });

            const btnDelete = document.getElementById('btn-delete');
            const btnDone = document.getElementById('btn-done');
            const sliderRotate = document.getElementById('slider-rotate');
            const sliderHeight = document.getElementById('slider-height');

            btnDelete.addEventListener('click', () => {
                if (activeObject) {
                    if (activeObject === mainRoom) mainRoom = null; // Reset nếu xóa phòng
                    
                    scene.remove(activeObject); 
                    activeObject.traverse((child) => {
                        if (child.isMesh) {
                            child.geometry.dispose();
                            if (child.material.isMaterial) child.material.dispose();
                            else for (const material of child.material) material.dispose();
                        }
                    });
                    
                    const index = placedObjects.indexOf(activeObject);
                    if (index > -1) placedObjects.splice(index, 1); 
                    closeEditMode();
                    
                    if(!mainRoom) document.getElementById('status-bar').innerText = "Đã xóa phòng. Hệ thống trở về quét mặt sàn thật.";
                }
            });

            btnDone.addEventListener('click', () => closeEditMode());

            sliderRotate.addEventListener('input', (e) => {
                if (activeObject) activeObject.rotation.y = THREE.MathUtils.degToRad(e.target.value);
            });

            sliderHeight.addEventListener('input', (e) => {
                if (activeObject) {
                    const newOffset = parseFloat(e.target.value);
                    activeObject.position.y += (newOffset - (activeObject.userData.offsetY || 0));
                    activeObject.userData.offsetY = newOffset;
                }
            });
        }

        function openEditMode(object) {
            activeObject = object;
            document.getElementById('edit-menu').style.display = 'block';
            document.getElementById('item-menu').style.display = 'none'; 
            document.getElementById('status-bar').innerText = "Chỉnh sửa vật thể (Vuốt/Kéo thanh trượt)";
            document.getElementById('slider-rotate').value = THREE.MathUtils.radToDeg(activeObject.rotation.y);
            document.getElementById('slider-height').value = activeObject.userData.offsetY || 0;
        }

        function closeEditMode() {
            activeObject = null;
            document.getElementById('edit-menu').style.display = 'none';
            document.getElementById('item-menu').style.display = 'block';
            document.getElementById('status-bar').innerText = "Chạm không gian để đặt, hoặc chạm vật để sửa";
        }

        function setupGestures() {
            document.body.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2 && activeObject) {
                    initialPinchDistance = getDistance(e.touches);
                    initialScale = activeObject.scale.x; 
                }
            }, { passive: false });

            document.body.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && activeObject) {
                    e.preventDefault(); 
                    const currentPinchDistance = getDistance(e.touches);
                    const pinchRatio = currentPinchDistance / initialPinchDistance;
                    let newScale = initialScale * pinchRatio;
                    newScale = Math.max(0.01, Math.min(newScale, 100.0)); 
                    activeObject.scale.set(newScale, newScale, newScale);
                }
            }, { passive: false });
        }

        function getDistance(touches) {
            const dx = touches[0].pageX - touches[1].pageX;
            const dy = touches[0].pageY - touches[1].pageY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize( window.innerWidth, window.innerHeight );
        }

        // --- VÒNG LẶP RENDER: QUYẾT ĐỊNH QUÉT SÀN THẬT HAY SÀN ẢO ---
        function animate() {
            renderer.setAnimationLoop( render );
        }

        function render( timestamp, frame ) {
            const delta = clock.getDelta();
            mixers.forEach(mixer => mixer.update(delta));

            if ( frame ) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // 1. NẾU CHƯA CÓ PHÒNG -> QUÉT MẶT SÀN THẬT QUA WEBXR HIT TEST
                if (!mainRoom) {
                    if ( hitTestSourceRequested === false ) {
                        session.requestReferenceSpace( 'viewer' ).then( function ( referenceSpace ) {
                            session.requestHitTestSource( { space: referenceSpace } ).then( function ( source ) {
                                hitTestSource = source;
                            } );
                        } );
                        session.addEventListener( 'end', function () {
                            hitTestSourceRequested = false;
                            hitTestSource = null;
                            planeFound = false; 
                            mainRoom = null;
                            document.getElementById('item-menu').style.display = 'none';
                        } );
                        hitTestSourceRequested = true;
                    }

                    if ( hitTestSource ) {
                        const hitTestResults = frame.getHitTestResults( hitTestSource );
                        if ( hitTestResults.length > 0 ) {
                            const hit = hitTestResults[ 0 ];
                            reticle.visible = true;
                            reticle.matrix.fromArray( hit.getPose( referenceSpace ).transform.matrix );

                            if (!planeFound) {
                                planeFound = true;
                                document.getElementById('item-menu').style.display = 'block';
                                document.getElementById('status-bar').innerText = "Đã thấy sàn! Vui lòng chọn 'Phòng vẽ 3D' để làm khung nền trước.";
                            }
                        } else {
                            reticle.visible = false;
                        }
                    }
                } 
                // 2. NẾU ĐÃ ĐẶT PHÒNG -> CHUYỂN SANG QUÉT MÔ HÌNH 3D (VIRTUAL HIT TEST)
                else {
                    // Dùng Raycaster bắn từ giữa màn hình điện thoại vào căn phòng 3D
                    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                    const intersects = raycaster.intersectObject(mainRoom, true);

                    if (intersects.length > 0) {
                        reticle.visible = true;
                        
                        // Lấy tọa độ điểm chạm trên căn phòng
                        const hitPoint = intersects[0].point;
                        const faceNormal = intersects[0].face.normal;
                        
                        // Dịch chuyển vòng ngắm tới vị trí đó
                        const dummyMatrix = new THREE.Matrix4();
                        const dummyQuaternion = new THREE.Quaternion();
                        const dummyPosition = new THREE.Vector3().copy(hitPoint);
                        const dummyScale = new THREE.Vector3(1, 1, 1);
                        
                        // Xoay vòng ngắm khớp với góc nghiêng của mặt phẳng (tường/sàn bàn)
                        const up = new THREE.Vector3(0, 0, 1); // Vòng ngắm mặc định hướng Z
                        dummyQuaternion.setFromUnitVectors(up, faceNormal);
                        
                        dummyMatrix.compose(dummyPosition, dummyQuaternion, dummyScale);
                        reticle.matrix.copy(dummyMatrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render( scene, camera );
        }
    </script>
</body>
</html>
