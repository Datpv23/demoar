<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR – Nội Thất 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green:   #22c55e;
            --red:     #ef4444;
            --surface: rgba(10, 12, 18, 0.72);
            --glass:   rgba(255, 255, 255, 0.10);
            --border:  rgba(255, 255, 255, 0.14);
            --text:    #f0f4f8;
            --radius:  16px;
        }

        body {
            overflow: hidden;
            touch-action: none;
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #000;
            color: var(--text);
        }

        /* ── Status bar ── */
        #status-bar {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            pointer-events: none;
            z-index: 50;
            letter-spacing: 0.02em;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.3s;
        }

        /* ── Spinner ── */
        #spinner {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            z-index: 60;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
        }
        #spinner.active { display: flex; }
        .spin-ring {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Item menu ── */
        #item-menu {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            z-index: 40;
            white-space: nowrap;
            overflow-x: auto;
            scroll-behavior: smooth;
            max-width: 92vw;
            scrollbar-width: none;
            gap: 8px;
            align-items: center;
        }
        #item-menu::-webkit-scrollbar { display: none; }

        .item-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 9px 16px;
            margin: 0 3px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s, transform 0.12s;
            white-space: nowrap;
        }
        .item-btn:active { transform: scale(0.94); }
        .item-btn.active {
            background: rgba(34,197,94,0.18);
            border-color: var(--green);
            color: var(--green);
        }
        .item-btn .icon { font-size: 16px; }

        /* ── Edit panel ── */
        #edit-panel {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px 16px;
            z-index: 40;
            width: min(90vw, 420px);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 16px;
            text-align: center;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .slider-label {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            width: 36px;
            flex-shrink: 0;
            letter-spacing: 0.04em;
        }
        .slider-value {
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }
        input[type=range] {
            flex-grow: 1;
            accent-color: var(--green);
            height: 4px;
            cursor: pointer;
        }

        /* Scale row (non-interactive display) */
        .scale-display {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .act-btn {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.12s;
        }
        .act-btn:active { transform: scale(0.96); opacity: 0.85; }
        #btn-delete { background: var(--red); color: #fff; }
        #btn-done   { background: var(--green); color: #fff; }

        /* ── AR button override ── */
        #ARButton {
            position: fixed !important;
            bottom: 28px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            background: var(--green) !important;
            border: none !important;
            border-radius: 100px !important;
            color: #fff !important;
            font-family: inherit !important;
            font-size: 14px !important;
            font-weight: 700 !important;
            padding: 14px 36px !important;
            letter-spacing: 0.04em !important;
            cursor: pointer !important;
            z-index: 30 !important;
        }
    </style>
</head>
<body>

<div id="status-bar">Đang khởi động AR…</div>

<div id="spinner"><div class="spin-ring"></div></div>

<!-- Item menu -->
<div id="item-menu">
    <button class="item-btn" data-model="models/PHONGVE3D.glb" id="btn-room">
        <span class="icon">🏠</span>Phòng 3D
    </button>
    <button class="item-btn" data-model="models/bang.glb">
        <span class="icon">🪑</span>Bảng
    </button>
    <button class="item-btn" data-model="models/bangv.glb">
        <span class="icon">📋</span>Bảng V
    </button>
    <button class="item-btn" data-model="models/BINHCAFE.glb">
        <span class="icon">☕</span>Bình Cafe
    </button>
    <button class="item-btn" data-model="models/gom1.glb">
        <span class="icon">🏺</span>Gốm 1
    </button>
    <button class="item-btn" data-model="models/gom2.glb">
        <span class="icon">🏺</span>Gốm 2
    </button>
    <button class="item-btn" data-model="models/khoinon.glb">
        <span class="icon">🔺</span>Khối Nón
    </button>
    <button class="item-btn" data-model="models/khoitru.glb">
        <span class="icon">🔵</span>Khối Trụ
    </button>
    <button class="item-btn" data-model="models/khoivuong.glb">
        <span class="icon">🟫</span>Khối Vuông
    </button>
</div>

<!-- Edit panel -->
<div id="edit-panel">
    <div class="panel-title">Chỉnh sửa vật thể</div>

    <div class="slider-row">
        <span class="slider-label">Xoay</span>
        <input type="range" id="sl-rotate" min="0" max="360" value="0" step="1">
        <span class="slider-value" id="val-rotate">0°</span>
    </div>

    <div class="slider-row">
        <span class="slider-label">Cao</span>
        <input type="range" id="sl-height" min="-0.5" max="2.5" step="0.01" value="0">
        <span class="slider-value" id="val-height">0m</span>
    </div>

    <div class="slider-row">
        <span class="slider-label">To</span>
        <input type="range" id="sl-scale" min="0.05" max="5" step="0.01" value="1">
        <span class="slider-value" id="val-scale">1×</span>
    </div>

    <div class="btn-row">
        <button id="btn-delete" class="act-btn">🗑 Xóa</button>
        <button id="btn-done"   class="act-btn">✓ Xong</button>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─────────────────────────────────────────────
//  Globals
// ─────────────────────────────────────────────
let renderer, scene, camera, controller, reticle;
let hitTestSource = null, hitTestSourceRequested = false;
let planeFound = false;

let currentModelPath = null;
const placedObjects = [];   // all wrappers in scene
let activeObject = null;    // currently selected wrapper

let mainRoom = null;        // the room wrapper (special)

// Mixers: map from wrapper → AnimationMixer
// so we can clean up when deleting
const mixerMap = new Map();
const clock = new THREE.Clock();
const gltfLoader = new GLTFLoader();
const raycaster = new THREE.Raycaster();

// UI shield: set true while finger is on a UI element
let uiTouched = false;

// Pinch state
let pinchActive = false;
let pinchInitDist = 0;
let pinchInitScale = 1;

// ─────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────
init();
setupUI();
setupGestures();
renderer.setAnimationLoop(renderLoop);

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

    scene.add(new THREE.AmbientLight(0xffffff, 1.8));
    const dir = new THREE.DirectionalLight(0xffffff, 1.6);
    dir.position.set(3, 6, 3);
    scene.add(dir);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(
        ARButton.createButton(renderer, {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.body }
        })
    );

    // Reticle
    const geo = new THREE.RingGeometry(0.08, 0.13, 36);
    geo.rotateX(-Math.PI / 2);
    reticle = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide }));
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Controller (XR tap)
    controller = renderer.xr.getController(0);
    controller.addEventListener('select', onSelect);
    scene.add(controller);

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
}

// ─────────────────────────────────────────────
//  XR tap → place / move / select
// ─────────────────────────────────────────────
function onSelect() {
    if (uiTouched) return;          // shield: finger was on UI
    if (!reticle.visible) return;

    // Build raycaster from controller forward
    const mat = new THREE.Matrix4().identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(mat);

    // Try to hit an existing placed object (excluding mainRoom)
    const hittable = placedObjects.filter(o => o !== mainRoom);
    const hits = raycaster.intersectObjects(hittable, true);
    if (hits.length > 0) {
        const wrapper = findWrapper(hits[0].object);
        if (wrapper) {
            if (activeObject === wrapper) closeEditMode();
            else openEditMode(wrapper);
            return;
        }
    }

    // Move activeObject to reticle
    if (activeObject) {
        const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
        activeObject.position.copy(pos);
        activeObject.position.y += activeObject.userData.offsetY || 0;
        setStatus('Đã dời vật. Bấm ✓ Xong để chốt.');
        return;
    }

    // Place new model
    if (currentModelPath) placeModel(currentModelPath);
}

// ─────────────────────────────────────────────
//  Place model
// ─────────────────────────────────────────────
function placeModel(path) {
    const isRoom = path.includes('PHONGVE3D');
    showSpinner(true);
    setStatus('Đang tải mô hình…');

    gltfLoader.load(path, (gltf) => {
        const model = gltf.scene;

        // Material + geometry prep
        model.traverse(child => {
            if (!child.isMesh) return;
            child.geometry.computeBoundingBox();
            child.geometry.computeBoundingSphere();
            if (child.material) {
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach(m => { m.side = THREE.DoubleSide; });
            }
        });

        // Auto-scale (skip room)
        if (!isRoom) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const max = Math.max(size.x, size.y, size.z);
            if (max > 1.0) model.scale.setScalar(0.5 / max);
            else if (max < 0.05) model.scale.setScalar(0.2 / max);
        }

        // Pivot: bottom-center
        const box2 = new THREE.Box3().setFromObject(model);
        const ctr  = box2.getCenter(new THREE.Vector3());
        model.position.set(-ctr.x, -box2.min.y, -ctr.z);

        // Wrapper
        const wrapper = new THREE.Group();
        wrapper.userData.offsetY = 0;
        wrapper.userData.baseScale = model.scale.x;

        if (isRoom) {
            wrapper.position.setFromMatrixPosition(reticle.matrix);
            wrapper.quaternion.setFromRotationMatrix(reticle.matrix);
        } else {
            wrapper.position.setFromMatrixPosition(reticle.matrix);
        }

        wrapper.add(model);
        scene.add(wrapper);
        placedObjects.push(wrapper);

        // Animations → tracked in mixerMap
        if (gltf.animations?.length) {
            const mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach(clip => mixer.clipAction(clip).play());
            mixerMap.set(wrapper, mixer);
        }

        if (isRoom) {
            mainRoom = wrapper;
            // Pre-compute shrunken bounding box for clamping
            mainRoom.updateMatrixWorld(true);
            const rb = new THREE.Box3().setFromObject(mainRoom);
            const rs = rb.getSize(new THREE.Vector3());
            rb.min.x += rs.x * 0.05; rb.max.x -= rs.x * 0.05;
            rb.min.z += rs.z * 0.05; rb.max.z -= rs.z * 0.05;
            mainRoom.userData.roomBox = rb;

            document.getElementById('btn-room').style.display = 'none';
            currentModelPath = null;
            itemBtns().forEach(b => b.classList.remove('active'));
            setStatus('Phòng đã đặt! Trỏ vào bề mặt ảo để đặt vật phẩm.');
        } else {
            setStatus('Chạm vật để sửa, hoặc chọn vật khác để đặt tiếp.');
        }

        showSpinner(false);
    }, undefined, (err) => {
        console.error(err);
        setStatus('❌ Lỗi tải model. Kiểm tra đường dẫn file.');
        showSpinner(false);
    });
}

// ─────────────────────────────────────────────
//  Edit mode
// ─────────────────────────────────────────────
function openEditMode(obj) {
    activeObject = obj;
    // Sync sliders to actual object state
    const rotDeg = Math.round(THREE.MathUtils.radToDeg(obj.rotation.y) % 360);
    const offsetY = obj.userData.offsetY ?? 0;
    const scale   = obj.scale.x;

    el('sl-rotate').value = rotDeg;   el('val-rotate').textContent = rotDeg + '°';
    el('sl-height').value = offsetY;  el('val-height').textContent = offsetY.toFixed(2) + 'm';
    el('sl-scale').value  = scale;    el('val-scale').textContent  = scale.toFixed(2) + '×';

    el('edit-panel').style.display = 'block';
    el('item-menu').style.display  = 'none';
    setStatus('Kéo thanh trượt để chỉnh · Chụm để phóng to/thu nhỏ');
}

function closeEditMode() {
    activeObject = null;
    el('edit-panel').style.display = 'none';
    el('item-menu').style.display  = 'flex';
    setStatus('Chạm không gian để đặt · Chạm vật để chỉnh sửa');
}

function deleteActive() {
    if (!activeObject) return;
    if (activeObject === mainRoom) {
        mainRoom = null;
        el('btn-room').style.display = 'inline-flex';
        setStatus('Đã xóa phòng. Quét sàn thật để đặt lại.');
    }
    // Dispose
    activeObject.traverse(child => {
        if (!child.isMesh) return;
        child.geometry?.dispose();
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => m?.dispose());
    });
    // Remove mixer
    if (mixerMap.has(activeObject)) {
        mixerMap.get(activeObject).stopAllAction();
        mixerMap.delete(activeObject);
    }
    scene.remove(activeObject);
    placedObjects.splice(placedObjects.indexOf(activeObject), 1);
    closeEditMode();
}

// ─────────────────────────────────────────────
//  UI setup
// ─────────────────────────────────────────────
function setupUI() {
    // Shield: any touch on UI elements
    [el('item-menu'), el('edit-panel')].forEach(panel => {
        panel.addEventListener('pointerdown',  () => { uiTouched = true; });
        panel.addEventListener('touchstart',   () => { uiTouched = true; }, { passive: true });
        panel.addEventListener('pointerup',    () => { uiTouched = false; });
        panel.addEventListener('touchend',     () => { uiTouched = false; });
        panel.addEventListener('touchcancel',  () => { uiTouched = false; });
        // Prevent WebXR from receiving the event
        panel.addEventListener('beforexrselect', e => e.preventDefault());
    });

    // Item buttons
    itemBtns().forEach(btn => {
        btn.addEventListener('click', () => {
            itemBtns().forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentModelPath = btn.dataset.model;
            if (activeObject) closeEditMode();
            const isRoom = currentModelPath.includes('PHONGVE3D');
            setStatus(isRoom
                ? 'Quét sàn thật → chạm vòng xanh để đặt Phòng.'
                : mainRoom
                    ? 'Trỏ vào bề mặt trong Phòng → chạm để đặt vật.'
                    : 'Chạm vòng xanh để đặt vật phẩm.'
            );
        });
    });

    // Edit panel controls
    el('sl-rotate').addEventListener('input', e => {
        if (!activeObject) return;
        const deg = parseFloat(e.target.value);
        activeObject.rotation.y = THREE.MathUtils.degToRad(deg);
        el('val-rotate').textContent = Math.round(deg) + '°';
    });

    el('sl-height').addEventListener('input', e => {
        if (!activeObject) return;
        const newOff = parseFloat(e.target.value);
        const delta  = newOff - (activeObject.userData.offsetY || 0);
        activeObject.position.y += delta;
        activeObject.userData.offsetY = newOff;
        el('val-height').textContent = newOff.toFixed(2) + 'm';
    });

    el('sl-scale').addEventListener('input', e => {
        if (!activeObject) return;
        const s = parseFloat(e.target.value);
        activeObject.scale.setScalar(s);
        el('val-scale').textContent = s.toFixed(2) + '×';
    });

    el('btn-delete').addEventListener('click', deleteActive);
    el('btn-done').addEventListener('click', closeEditMode);
}

// ─────────────────────────────────────────────
//  Pinch-to-scale gesture
// ─────────────────────────────────────────────
function setupGestures() {
    document.body.addEventListener('touchstart', e => {
        if (uiTouched || !activeObject || e.touches.length !== 2) return;
        pinchActive    = true;
        pinchInitDist  = touchDist(e.touches);
        pinchInitScale = activeObject.scale.x;
    }, { passive: true });

    document.body.addEventListener('touchmove', e => {
        if (!pinchActive || uiTouched || !activeObject || e.touches.length !== 2) return;
        e.preventDefault();
        const ratio    = touchDist(e.touches) / pinchInitDist;
        const newScale = Math.max(0.01, Math.min(pinchInitScale * ratio, 20));
        activeObject.scale.setScalar(newScale);
        // Sync scale slider if panel open
        const slScale = el('sl-scale');
        if (slScale && parseFloat(slScale.max) >= newScale) {
            slScale.value = newScale;
            el('val-scale').textContent = newScale.toFixed(2) + '×';
        }
    }, { passive: false });

    document.body.addEventListener('touchend', e => {
        if (e.touches.length < 2) pinchActive = false;
    }, { passive: true });
}

function touchDist(touches) {
    const dx = touches[0].pageX - touches[1].pageX;
    const dy = touches[0].pageY - touches[1].pageY;
    return Math.hypot(dx, dy);
}

// ─────────────────────────────────────────────
//  Render loop
// ─────────────────────────────────────────────
function renderLoop(timestamp, frame) {
    const delta = clock.getDelta();
    mixerMap.forEach(mixer => mixer.update(delta));

    if (frame) {
        const refSpace = renderer.xr.getReferenceSpace();
        const session  = renderer.xr.getSession();

        if (!mainRoom) {
            // ── Hit-test on real surface ──
            if (!hitTestSourceRequested) {
                session.requestReferenceSpace('viewer').then(vs => {
                    session.requestHitTestSource({ space: vs }).then(src => {
                        hitTestSource = src;
                    });
                });
                session.addEventListener('end', onSessionEnd);
                hitTestSourceRequested = true;
            }

            if (hitTestSource) {
                const results = frame.getHitTestResults(hitTestSource);
                if (results.length > 0) {
                    reticle.visible = true;
                    reticle.matrix.fromArray(results[0].getPose(refSpace).transform.matrix);
                    if (!planeFound) {
                        planeFound = true;
                        el('item-menu').style.display = 'flex';
                        setStatus("Đã thấy sàn! Chọn 'Phòng 3D' để đặt trước.");
                    }
                } else {
                    reticle.visible = false;
                }
            }
        } else {
            // ── Hit-test on virtual room surfaces ──
            // Release real hit-test source to save resources
            if (hitTestSource) {
                hitTestSource.cancel?.();
                hitTestSource = null;
            }

            const mat = new THREE.Matrix4().identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(mat);

            // Update matrixWorld before raycast
            mainRoom.updateMatrixWorld(true);
            const hits = raycaster.intersectObject(mainRoom, true);

            if (hits.length > 0) {
                reticle.visible = true;
                const hitPt = hits[0].point.clone();

                // Clamp inside room bounds
                if (mainRoom.userData.roomBox) {
                    hitPt.clamp(mainRoom.userData.roomBox.min, mainRoom.userData.roomBox.max);
                }

                // Align reticle to surface normal
                const worldNormal = hits[0].face.normal.clone()
                    .transformDirection(hits[0].object.matrixWorld)
                    .normalize();
                const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), worldNormal);
                const m = new THREE.Matrix4().compose(hitPt, q, new THREE.Vector3(1, 1, 1));
                reticle.matrix.copy(m);
            } else {
                reticle.visible = false;
            }
        }
    }

    renderer.render(scene, camera);
}

function onSessionEnd() {
    hitTestSourceRequested = false;
    hitTestSource = null;
    planeFound = false;
    mainRoom = null;
    el('item-menu').style.display = 'none';
    el('edit-panel').style.display = 'none';
}

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function itemBtns() { return document.querySelectorAll('.item-btn'); }
function setStatus(msg) { el('status-bar').textContent = msg; }
function showSpinner(on) {
    el('spinner').classList.toggle('active', on);
}

function findWrapper(mesh) {
    let node = mesh;
    while (node) {
        if (placedObjects.includes(node)) return node;
        node = node.parent;
    }
    return null;
}
</script>
